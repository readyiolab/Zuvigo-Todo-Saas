# nginx reverse proxy for todo.zuvigo.com
# Copy to: /etc/nginx/sites-available/todo.zuvigo.com
# Then:
#   sudo ln -s /etc/nginx/sites-available/todo.zuvigo.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d todo.zuvigo.com
#
# There is no separate API host — Next.js serves UI + /api/* + Server Actions on :3000.

server {
  listen 80;
  listen [::]:80;
  server_name todo.zuvigo.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name todo.zuvigo.com;

  # certbot manages these after first run:
  # ssl_certificate /etc/letsencrypt/live/todo.zuvigo.com/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/todo.zuvigo.com/privkey.pem;
  # include /etc/letsencrypt/options-ssl-nginx.conf;
  # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  client_max_body_size 30m;

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 60s;
  }
}
